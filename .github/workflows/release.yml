name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit:coverage

      - name: Run type checking
        run: npm run type-check

      - name: Run linting
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Build extension
        run: npm run build:ext

      - name: Create release archive
        run: |
          cd dist
          zip -r ../anime-list-extension.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: AnimeList Chrome Extension ${{ inputs.version || github.ref_name }}
          body: |
            ## Changes in this Release

            - Chrome extension package ready for installation
            - All tests passing
            - Code quality checks passed

            ## Installation

            1. Download the `anime-list-extension.zip` file
            2. Extract the contents
            3. Open Chrome and go to `chrome://extensions/`
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder

            ## Features

            - ✨ Episode progress tracking
            - 📝 Plan to watch lists  
            - 🙈 Hide unwanted anime
            - 🎨 Beautiful anime-themed UI

          files: anime-list-extension.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
